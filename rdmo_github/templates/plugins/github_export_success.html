{% extends 'core/page.html' %}
{% load i18n core_tags %}

{% block page %}

    <h1>{% trans 'Successful Export to GitHub' %}</h1>

    <ul>
        {% for export in processed_exports %}
            <li>{{ export.label }}: {{ export.processing_status }}</li>
        {% endfor %}
    </ul>

    <a href="{{ repo_html_url }}">{% trans 'Go to GitHub repository' %}</a>

{% endblock %}
